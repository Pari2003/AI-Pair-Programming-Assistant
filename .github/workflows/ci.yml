name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test
        continue-on-error: true # Tests might need a display server

      - name: Compile Extension
        run: npm run compile

      - name: Package VSIX
        run: npx vsce package --no-dependencies

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ai-pair-programming-assistant
          path: '*.vsix'
